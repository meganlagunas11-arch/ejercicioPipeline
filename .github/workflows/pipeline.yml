name: FastEat Pipeline

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  # 1. Build & Lint: Valida sintaxis
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxis de la función
        run: npm run lint

  # 2. Security: Inspecciona dependencias
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspección de seguridad
        run: npm audit --audit-level=high || true

  # 3. Staging: Simulación E2E del carrito
  staging:
    needs: [build-and-lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar simulación E2E
        run: npm run test:e2e

  # 4. Production: Despliega al aprobar release
  production:
    needs: [staging]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Desplegando automáticamente en producción tras aprobación del release..."